<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>akshara</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">akshara<span class="brand-dot">✦</span></div>
  <div class="chips">
    <button class="chip" id="chip-provider" title="switch provider (POST /api/provider)">
      <span class="chip-label" id="provider-name">—</span><span class="caret">▾</span></button>
    <button class="chip" id="chip-model" title="switch model">
      <span class="chip-label" id="model-name">—</span><span class="caret">▾</span></button>
    <button class="chip" id="chip-mode" title="permission mode — click to flip ask ⇄ yolo (tools run without asking in yolo)">
      <span class="chip-label" id="mode-label">—</span></button>
    <button class="chip" id="chip-env" title="session awareness — click cycles off ⇄ local ⇄ full ('full' adds your city via one public-IP lookup; hover for what the agent knows)">
      <span class="chip-label" id="env-label">—</span></button>
    <button class="chip" id="chip-tools" title="servers & tools — add mcp servers, switch anything off/on, even mid-run">
      ⚙ <span id="tools-count">—</span></button>
    <span class="chip chip-static" id="chip-cost" title="session cost — unknown slugs show no figure, never a guess"></span>
    <span class="chip chip-static hidden" id="chip-ctxbar">
      <span class="ctxbar"><span class="ctxbar-fill" id="ctx-fill"></span></span>
      <span id="ctx-pct"></span></span>
  </div>
  <div class="actions">
    <button class="ghost" id="btn-save" title="checkpoint session">save</button>
    <button class="ghost" id="btn-load" title="restore checkpoint">load</button>
    <button class="ghost" id="btn-compact" title="force context compaction">compact</button>
    <button class="ghost" id="btn-clear" title="reset history">clear</button>
  </div>
</header>

<div id="offline" class="hidden">connection lost — reconnecting…</div>

<main id="transcript" aria-live="polite"></main>

<div id="composer-wrap">
  <div id="staged" class="hidden"></div>
  <div id="statusline" class="hidden"><span class="spinner"></span><span id="status-text">connecting…</span></div>
  <div id="composer">
    <button id="btn-image" title="attach images (png/jpeg/gif/webp ≤5MB)">＋</button>
    <textarea id="input" rows="1" placeholder="message the agent…  (enter to send, shift+enter for newline)"
              autofocus></textarea>
    <button id="btn-send" title="send">➤</button>
    <button id="btn-cancel" class="danger hidden" title="stop the current turn (esc)">■ stop</button>
  </div>
  <input type="file" id="file-input" accept=".png,.jpg,.jpeg,.gif,.webp" multiple hidden>
</div>

<!-- one modal at a time: permission or ask -->
<div id="modal-backdrop" class="hidden">
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- the tools panel: separate overlay so an approval modal can still
     pop on top of it mid-run -->
<div id="tools-backdrop" class="hidden">
  <div id="tools-panel" role="dialog" aria-modal="true">
    <div class="tools-head">
      <h3>servers &amp; tools</h3>
      <span class="tools-note">off = never sent to the model, its calls fail as data — applies immediately, even mid-run</span>
      <button class="m-btn" id="tools-close">close</button>
    </div>
    <div id="mcp-section">
      <div class="mcp-head">
        <h4>mcp servers</h4>
        <span class="tools-note">connect new ones or cut them off — their tools come and go with them</span>
        <button class="m-btn" id="mcp-add-btn" title="connect a new mcp server">＋ add</button>
      </div>
      <div id="mcp-rows"></div>
      <div id="mcp-add-form" class="hidden">
        <div class="mcp-tabs">
          <button type="button" class="m-tab active" data-mode="fields">fields</button>
          <button type="button" class="m-tab" data-mode="json">paste json</button>
        </div>
        <div id="mcp-fields">
          <input id="mcp-name" placeholder="name — tools appear as mcp__NAME__…" spellcheck="false">
          <div class="mcp-transport">
            <label><input type="radio" name="mcp-transport" value="stdio" checked> runs a command</label>
            <label><input type="radio" name="mcp-transport" value="http"> talks to a url</label>
          </div>
          <input id="mcp-command" placeholder="command + arguments (e.g. python ~/server.py --port 1)" spellcheck="false">
          <input id="mcp-url" placeholder="http://127.0.0.1:8000/mcp" spellcheck="false" class="hidden">
          <textarea id="mcp-env" rows="2" placeholder="env vars for the server, one KEY=value per line (optional)"></textarea>
        </div>
        <div id="mcp-json" class="hidden">
          <textarea id="mcp-json-text" rows="5" spellcheck="false"
            placeholder='{"servers": {"tiny": {"command": "python", "args": ["tiny_mcp_server.py"]}}}'></textarea>
        </div>
        <label class="mcp-remember"><input type="checkbox" id="mcp-remember" checked>
          remember — reconnects on future launches</label>
        <div id="mcp-error" class="hidden"></div>
        <div class="mcp-actions">
          <button class="m-btn primary" id="mcp-submit">connect</button>
          <button class="m-btn" id="mcp-cancel-add">cancel</button>
        </div>
      </div>
    </div>
    <div class="tools-subhead">tools</div>
    <div id="tools-rows"></div>
  </div>
</div>

<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
